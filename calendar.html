    <section class="site-section" id="section-calendar" data-section="calendar" aria-label="Exhibitions">
      <main class="exhib" aria-label="Exhibitions">
        <div class="exhib-bg" aria-hidden="true">
          <video
            id="exhibVideo"
            class="exhib-video"
            poster="videos/exhibitions-bg-poster.jpg"
            muted
            loop
            playsinline
            webkit-playsinline
            disablepictureinpicture
            preload="metadata"
          >
            <source src="videos/exhibitions-bg-web.mp4" type="video/mp4" />
            <source src="videos/exhibitions-bg.mp4" type="video/mp4" />
          </video>
          <div class="exhib-bg__scrim"></div>
        </div>
        <div class="exhib-panel">
          <div class="exhib-cal" aria-label="Exhibitions calendar">
            <p class="exhib-cal__month" id="exhibMonthLabel" aria-live="polite"></p>
            <div class="exhib-cal__weekdays" aria-hidden="true">
              <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>
            <div class="exhib-cal__weeks" id="exhibCalWeeks"></div>
            <p class="exhib-cal__legend" aria-hidden="true">
              <span class="exhib-cal__legend-item exhib-cal__legend-item--today">today</span>
              <span class="exhib-cal__legend-item exhib-cal__legend-item--show">exhibition</span>
            </p>
          </div>
          <div class="exhib-detail" id="exhibDetail" hidden>

            <p class="exhib-detail__meta" id="exhibDetailMeta"></p>
            <p class="exhib-detail__body" id="exhibDetailBody"></p>

        </div>
